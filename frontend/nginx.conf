gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

server {
    listen 80;
    server_name ai-def.com www.ai-def.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://ai-def.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.ai-def.com;

    ssl_certificate /etc/letsencrypt/live/ai-def.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-def.com/privkey.pem;

    return 301 https://ai-def.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai-def.com;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/ai-def.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-def.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache" always;
    }

    location = /robots.txt {
        access_log off;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        access_log off;
        proxy_pass http://backend:8000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /assets/ {
        access_log off;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* ^/(?!api/|admin/|media/|static/|assets/).+\.(?:png|jpe?g|gif|svg|webp|avif|ico|mp4|webm|woff2?)$ {
        access_log off;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        try_files $uri /index.html;
    }

    location = /cms {
        return 302 /cms/;
    }

    location ^~ /cms/ {
        try_files $uri /cms/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /media/ {
        alias /media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /internal-admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /static/ {
        alias /static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }
}
