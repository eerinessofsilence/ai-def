<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
        name="description"
        content="AI DEF develops advanced autonomous systems, aviation platforms, and integrated technology solutions for defense and civil applications."
    />
    <title>AI-DEF</title>
    <link rel="preload" as="image" href="/hero-bg-1.jpg" />
    <script>
        (() => {
            const path = window.location.pathname.replace(/\/+$/, "") || "/";
            const routePath = path.replace(/^\/(?:en|de|sk|es|fr|it)(?=\/|$)/, "") || "/";
            const isArmsPage = window.location.hostname === "arms.ai-def.com"
                || routePath === "/store"
                || routePath.startsWith("/store/")
                || routePath === "/permits-certificates";
            document.title = isArmsPage ? "ARMS.Aidef" : "AI-DEF - We create the future";
            const isLanguageHome = /^\/(?:en|de|sk|es|fr|it)$/.test(path);
            if (path === "/" || isLanguageHome) {
                return;
            }

            const preload = document.createElement("link");
            preload.rel = "preload";
            preload.as = "image";
            preload.href = "/site-bg-top.png";
            preload.fetchPriority = "high";
            document.head.appendChild(preload);
        })();
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/icon-32x.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon/icon-64x.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon/icon-128x.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon/icon-256x.png" />

</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
