# nginx config for running BEHIND a TLS-terminating reverse proxy (Traefik).
#
# Traefik owns :80/:443, the Let's Encrypt certificates and the HTTP->HTTPS
# redirect, so this server only ever speaks plain HTTP on :80 inside the
# compose network. Everything else (SPA fallback, caching, /api, /admin,
# /media, /static routing) matches frontend/nginx.conf.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

# Trust the proxy's X-Forwarded-Proto, but fall back to $scheme when the header
# is absent. Django reads this via SECURE_PROXY_SSL_HEADER; passing a bare
# $scheme here would report "http" and break absolute HTTPS URLs (sitemap,
# CSRF origin checks) once traffic is proxied.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name www.ai-def.com;

    return 301 https://ai-def.com$request_uri;
}

server {
    listen 80 default_server;
    server_name ai-def.com arms.ai-def.com _;

    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache" always;
    }

    location = /robots.txt {
        access_log off;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        access_log off;
        proxy_pass http://backend:8000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /assets/ {
        access_log off;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* ^/(?!api/|admin/|media/|static/|assets/).+\.(?:png|jpe?g|gif|svg|webp|avif|ico|mp4|webm|woff2?)$ {
        access_log off;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /media/ {
        alias /media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /static/ {
        alias /static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }
}
