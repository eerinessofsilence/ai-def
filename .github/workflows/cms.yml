name: CMS checks

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run test:cms
      - run: npm run lint:cms
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aidef
          POSTGRES_USER: aidef
          POSTGRES_PASSWORD: aidef
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aidef -d aidef"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: aidef
      POSTGRES_PASSWORD: aidef
      POSTGRES_DB_NAME: aidef
      CMS_TEST_DB_NAME: test_aidef_cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run --settings=cms.test_settings
      - run: python manage.py test cms --settings=cms.test_settings --noinput --verbosity=2
