# Production stack.
#
# Differs from docker-compose.yml (local/standalone) in three ways:
#   1. Traefik owns :80/:443 and issues Let's Encrypt certificates automatically,
#      so there is no ./certs directory to populate or renew by hand.
#   2. nginx is built with nginx.proxied.conf and speaks plain HTTP behind Traefik.
#   3. Persistent data lives under ${DATA_DIR} (a single directory that is easy to
#      put on a dedicated disk and snapshot).
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Set DOMAIN, DOMAIN_WWW, ACME_EMAIL, DATA_DIR and POSTGRES_PASSWORD in .env first.

name: aidef

services:
  db:
    image: postgres:16-alpine
    container_name: aidef-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-aidef}
      POSTGRES_USER: ${POSTGRES_USER:-aidef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aidef} -d ${POSTGRES_DB_NAME:-aidef}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data

  backend:
    # Both image and build are set: `up` builds locally, while `pull` fetches the
    # published image when BACKEND_IMAGE points at ghcr.io (see docker-publish.yml).
    image: ${BACKEND_IMAGE:-aidef-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aidef-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${DOCKER_POSTGRES_HOST:-db}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s = socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8000)); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - static_volume:/app/static
      - ${DATA_DIR:-./data}/media:/app/media

  web:
    image: ${FRONTEND_IMAGE:-aidef-web:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NGINX_CONF: frontend/nginx.proxied.conf
    container_name: aidef-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - static_volume:/static
      - ${DATA_DIR:-./data}/media:/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.web.loadbalancer.server.port=80"
      # nginx already routes /api, /admin, /media and /static internally, so a
      # single router for the whole host is enough — no per-path Traefik rules.
      - "traefik.http.routers.web.rule=Host(`${DOMAIN:?DOMAIN must be set in .env}`) || Host(`${DOMAIN_WWW:-www.${DOMAIN}}`) || Host(`arms.ai-def.com`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"

  traefik:
    image: traefik:v3.3
    container_name: aidef-traefik
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--log.filePath=/logs/traefik.log"
      - "--accesslog.filePath=/logs/access.log"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # Redirect HTTP -> HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # Let's Encrypt. Port 80 must stay open for the ACME HTTP-01 challenge.
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL must be set in .env}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"

      # No dashboard, no API surface exposed.
      - "--api=false"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only: Traefik only needs to watch container labels.
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "${DATA_DIR:-./data}/traefik/letsencrypt:/letsencrypt"
      - "${DATA_DIR:-./data}/traefik/logs:/logs"
    labels:
      - "traefik.enable=false"

volumes:
  # Django static files are regenerated by collectstatic on every boot, so they
  # do not need to live on the persistent data disk.
  static_volume:
